# ─────────────────────────────────────────────────────────────
# SeatSync — Docker Compose
# ─────────────────────────────────────────────────────────────
# Options:
#   1. Local Dev (DB + Redis only, recommended for fast coding):
#      docker compose up -d db redis
#      ./database/scripts/reset.sh --seed
#
#   2. Full Containerized Stack (DB + Redis + Backend + Frontend):
#      docker compose up --build -d
#      ./database/scripts/reset.sh --seed
#
#   Database initialization is intentionally explicit, not hidden.
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    # Enable keyspace notifications for hold-expiry events
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-seatsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsync_dev}
      POSTGRES_DB: ${POSTGRES_DB:-seatsync}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-seatsync-super-secret-jwt-key-2026}
      JWT_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend Web (Nginx Static + API Reverse Proxy) ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
